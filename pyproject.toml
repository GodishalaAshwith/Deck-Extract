[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-ppt"
version = "0.1.0"
description = "Extract unique slides from video presentations into PNG, PDF, PPTX, and ZIP."
readme = "PRD_Video_to_Slides_Extractor.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",
    "python-pptx>=0.6.21",
    "imageio-ffmpeg>=0.4.9",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.scripts]
video-to-ppt = "video_to_ppt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
